<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" id="theme-color" content="#EEF0EC">
  <script>
    // Apply the saved theme (or the phone's) before the page paints
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.getElementById('theme-color').content = theme === 'dark' ? '#0F110E' : '#EEF0EC';
    })();
  </script>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23121411'/><text x='50' y='68' font-family='Arial,sans-serif' font-weight='800' font-size='56' text-anchor='middle' fill='%23D4F542'>G</text></svg>">
  <title>GymTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Login screen -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-logo">G</div>
      <h1 class="login-title">GymTracker</h1>
      <p class="login-subtitle">Inicia sesión para acceder a tu rutina</p>
      <div class="login-form">
        <input type="email" id="login-email" placeholder="Email" class="login-input" autocomplete="email">
        <input type="password" id="login-password" placeholder="Contraseña" class="login-input" autocomplete="current-password">
        <button class="btn-primary" id="login-btn" onclick="handleLogin()">Entrar</button>
        <button class="btn-secondary" id="register-btn" onclick="handleRegister()">Crear cuenta</button>
        <p class="login-error" id="login-error"></p>
      </div>
    </div>
  </div>

  <!-- Pending approval screen -->
  <div class="login-screen" id="pending-screen" style="display:none">
    <div class="login-card">
      <div class="login-logo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <h1 class="login-title">Cuenta pendiente</h1>
      <p class="login-subtitle">Tu cuenta está esperando aprobación. La administradora la activará pronto.</p>
      <button class="btn-secondary" onclick="handleLogout()">Cerrar sesión</button>
    </div>
  </div>

  <!-- App (hidden until login) -->
  <div id="app-container" style="display:none">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-brand">
        <span class="nav-logo">G</span>
        <span class="nav-title">GymTracker</span>
      </div>
      <div class="nav-actions">
        <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()"></button>
        <button class="btn-icon" onclick="handleLogout()" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
        </button>
      </div>
    </nav>

    <!-- Routine tabs -->
    <div class="routine-tabs" id="routine-tabs"></div>

    <!-- Session progress -->
    <div id="stats-row"></div>

    <!-- Routine header -->
    <div class="routine-header" id="routine-header"></div>

    <!-- Exercises grid -->
    <div class="exercises" id="exercises"></div>

    <!-- FAB button -->
    <button class="fab" onclick="openAddExercise()" aria-label="Añadir ejercicio">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-handle"></div>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
